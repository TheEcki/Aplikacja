name: Android APK

on:
  push:
    branches: [main, "arena/**"]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adres bazowy API (np. https://btsearch.pl/api/v1)"
        required: false
        default: "https://btsearch.pl/api/v1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: |
          API_URL="${{ github.event.inputs.api_url }}"
          API_URL="${API_URL:-https://btsearch.pl/api/v1}"
          gradle :app:assembleDebug --no-daemon -PBTSEARCH_API_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: btsearch-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
